services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - conduit
      - conduit-admin
      - admin-web

  conduit:
    build:
      context: .
      dockerfile: Dockerfile.conduit
    expose:
      - "8000"
      - "3000"

  conduit-admin:
    build:
      context: .
      dockerfile: Dockerfile.conduit-admin
    ports:
      - "8080:8080"

  admin-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    expose:
      - "80"
