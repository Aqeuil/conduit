syntax = "proto3";

package api.v1.common;

option go_package = "conduit/api/v1/common;common";
option java_multiple_files = true;
option java_package = "api.v1.common";


message PluginParamRule {
  string type = 1;
  string name = 2;
  repeated PluginParamRule children = 3;
}

message PluginInfo {
  string key = 1;
  string desc = 2;
  repeated PluginParamRule rule = 3;
}
