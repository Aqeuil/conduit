syntax = "proto3";

package api.v1.conduit_admin;

import "google/api/annotations.proto";

option go_package = "conduit/api/v1/conduit-admin;conduit_admin";

// RouterNode represents either a directory or a route in the unified tree.
// type = "directory": name, sort_order are meaningful; path/method/etc are empty.
// type = "router":    path, method, headers, schemas, description are meaningful.

service RouterAdmin {
  rpc CreateRouter (CreateRouterReq) returns (RouterNode) {
    option (google.api.http) = { post: "/router/create", body: "*" };
  }
  rpc UpdateRouter (UpdateRouterReq) returns (RouterNode) {
    option (google.api.http) = { post: "/router/update", body: "*" };
  }
  rpc DeleteRouter (DeleteRouterReq) returns (DeleteRouterResp) {
    option (google.api.http) = { post: "/router/delete", body: "*" };
  }
  rpc GetRouter (GetRouterReq) returns (RouterNode) {
    option (google.api.http) = { post: "/router/get", body: "*" };
  }
  rpc ListRouters (ListRoutersReq) returns (ListRoutersResp) {
    option (google.api.http) = { post: "/router/list", body: "*" };
  }
}

message RouterNode {
  int32  id              = 1;
  string app_id          = 2;
  int32  parent_id       = 3;
  string type            = 4;  // "directory" | "router"

  // directory fields
  string name            = 5;
  int32  sort_order      = 6;

  // router fields
  string path            = 7;
  string method          = 8;
  string headers         = 9;   // JSON array
  string request_schema  = 10;  // JSON object
  string response_schema = 11;  // JSON object
  string description     = 12;

  string created_at      = 13;
  string updated_at      = 14;

  repeated RouterNode children = 15;
}

message CreateRouterReq {
  string app_id          = 1;
  int32  parent_id       = 2;
  string type            = 3;  // "directory" | "router"

  // directory fields
  string name            = 4;
  int32  sort_order      = 5;

  // router fields
  string path            = 6;
  string method          = 7;
  string headers         = 8;
  string request_schema  = 9;
  string response_schema = 10;
  string description     = 11;
}

message UpdateRouterReq {
  int32  id              = 1;
  int32  parent_id       = 2;

  // directory fields
  string name            = 3;
  int32  sort_order      = 4;

  // router fields
  string path            = 5;
  string method          = 6;
  string headers         = 7;
  string request_schema  = 8;
  string response_schema = 9;
  string description     = 10;
}

message DeleteRouterReq  { int32 id = 1; }
message DeleteRouterResp {}

message GetRouterReq { int32 id = 1; }

message ListRoutersReq {
  string app_id = 1;
}

message ListRoutersResp {
  repeated RouterNode routers = 1;
}
